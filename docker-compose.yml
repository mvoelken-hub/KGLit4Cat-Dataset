services:

  neo4j:
    image: neo4j:2026.01.3
    restart: always
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_server_jvm_additional: "--add-modules jdk.incubator.vector"
    volumes:
      - ./data/docker/neo4j/data:/data
      - ./data/docker/neo4j/logs:/logs
      - ./data/docker/neo4j/plugins:/plugins

  ollama:
    image: ollama/ollama:latest
    restart: always
    environment:
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_HOST=0.0.0.0:11433
    volumes:
      - ./data/docker/ollama/data:/root/.ollama

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      neo4j:
        condition: service_started
      ollama:
        condition: service_started
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/docker/api/data:/app/.runtime
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
