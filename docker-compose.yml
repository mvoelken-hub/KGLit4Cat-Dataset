services:

  neo4j:
    image: neo4j:2026.01.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:${NEO4J_PORT}:${NEO4J_PORT}"
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_server_bolt_listen__address: ":${NEO4J_PORT}"
      NEO4J_server_jvm_additional: "--add-modules jdk.incubator.vector"
    volumes:
      - ./data/docker/neo4j/data:/data
      - ./data/docker/neo4j/logs:/logs
      - ./data/docker/neo4j/plugins:/plugins

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_HOST=0.0.0.0:${OLLAMA_PORT}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
    ports:
      - "127.0.0.1:${OLLAMA_PORT}:${OLLAMA_PORT}"
    volumes:
      - ./data/docker/ollama/data:/root/.ollama
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ${SIMONE_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/docker/api/data:/app/.runtime
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${FRONTEND_PORT}:80"
    restart: unless-stopped
