[project]
name = "SIMONE"
version = "0.1.0"
description = "My thesis work contributes an automated extraction approach that turns heterogeneous catalysis research data into structured, reusable, and FAIR-compliant datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.4.7",
    "fastapi[standard]>=0.136.1",
    "jsonschema>=4.26.0",
    "linkml>=1.11.0",
    "linkml-runtime>=1.11.0",
    "ollama>=0.6.2",
    "pandas[excel]>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[openai]>=1.97.0",
    "pymupdf>=1.27.2.3",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "rdflib-neo4j>=1.1",
    "scikit-learn>=1.8.0",
    "typer>=0.15.0",
]

[project.scripts]
simone = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "infra*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]

[tool.coverage.run]
branch = true
source = ["app", "infra"]
omit = [
    "app/bootstrap.py",
    "app/cli.py",
    "app/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
